<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - 页面不存在</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #333; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { text-align: center; background: #fff; padding: 48px 64px; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .code { font-size: 56px; font-weight: 700; color: #e74c3c; }
    .msg { font-size: 16px; color: #666; margin: 12px 0 24px; }
    a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <div class="msg">页面不存在或已被移除</div>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
